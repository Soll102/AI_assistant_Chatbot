name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check VITE_API_BASE
        run: |
          if [ -z "$VITE_API_BASE" ]; then echo "::error::Set repo Variables.VITE_API_BASE to your Vercel backend URL, e.g. https://your-backend.vercel.app"; exit 1; fi
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Build
        run: npm run build
        env:
          # Set repo variable VITE_API_BASE to your Vercel backend URL, e.g.
          # https://your-backend.vercel.app — GitHub: Settings → Variables → New.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
